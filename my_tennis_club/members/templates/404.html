<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endereço Não Encontrado</title>
  </head>
  <body>
    <!-- 
    Personalize o Modelo 404
    O Django procurará um arquivo chamado (404.html) 
    na pasta (templates) e o exibirá quando houver 
    um erro 404.

    Se tal arquivo não existir, o Django mostra o 
    "Não Encontrado" que você viu no exemplo acima.

    Para personalizar essa mensagem, tudo o que você 
    precisa fazer é criar um arquivo (404.html) na pasta 
    (templates), nomeá-lo e preenchê-lo com o que você 
    quiser dizer:
    -->
    <h1>Ooooops!</h1>

    <p>Eu não encontrei o arquivo que você requisitou!</p>
  </body>
</html>
